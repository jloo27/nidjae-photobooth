<!DOCTYPE html>
<html lang="id" class="h-full bg-[var(--sage-bg)]">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musim Mekarnya Rasa Booth</title>
  <link rel="icon" href="https://musim-mekarnya-rasa-fanzine.netlify.app/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --warm-white: #FDFAF4;
      --isabeline: #f2d8e2;
      --parchment: #e8d6ca;
      --brown: #4A3728;
      --brown-mid: #7A5C48;
      --brown-light: #B09080;
      --sage: #7e8560;
      --sage-light: #A8B894;
      --sage-bg: #E8EBDC;
      --mauve: #C28B96;
      --mauve-light: #E8C4CC;
      --mauve-bg: #FAEFF1;
      --text: #3A2C20;
      --muted: #9A8070;
      --tile-gap: 8px;
      --board-bg: var(--parchment);
      --tile-bg: var(--warm-white);
      --tile-border: var(--brown-light);
      --tile-text: var(--text);
      --accent: var(--mauve);
      --empty-bg: rgba(176, 144, 128, 0.25);
    }

    body {
      color: var(--text);
      font-family: 'EB Garamond', serif;
      background: url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejgxanU3M2Z4NHU4a2ZjeWJoMzRzODFkb2FzanhiZTFlaGhkY3Q3MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/xThtawJ5higNRr1pq8/giphy.gif') center/cover no-repeat fixed,
        linear-gradient(180deg, var(--warm-white) 0%, var(--isabeline) 38%, var(--isabeline) 75%);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    button,
    input,
    select,

    .font-heading {
      font-family: 'DM Sans', sans-serif;
    }

    .font-serif-custom {
      font-family: 'EB Garamond', serif;
    }

    .footer {
      display: flex;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 12px;
    }

    .footer a {
      text-decoration: none;
      color: var(--text);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      flex-shrink: 0;
      margin-left: 10px;
      margin-right: 10px;
    }

    .footer a:hover {
      color: var(--brown-mid);
    }

    .sec-rule {
      width: 150px;
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--sage-light), transparent);
    }

    .sec-rule-left {
      width: 150px;
      flex: 1;
      height: 1px;
      background: linear-gradient(to left, var(--sage-light), transparent);
    }

    /* Filter Presets */
    .filter-normal {
      filter: none;
    }

    .filter-vintage {
      filter: sepia(0.35) contrast(1.1) brightness(0.95) saturate(1.2);
    }

    .filter-warm {
      filter: sepia(0.2) saturate(1.35) hue-rotate(-10deg) brightness(1.05);
    }

    .filter-monochrome {
      filter: grayscale(1) contrast(1.25) brightness(1.05);
    }

    .filter-sage {
      filter: hue-rotate(40deg) saturate(0.85) contrast(1.1) brightness(0.98);
    }

    .filter-rosy {
      filter: hue-rotate(-25deg) saturate(1.3) contrast(1.08) brightness(1.02);
    }

    .filter-dramatic {
      filter: contrast(1.35) brightness(0.9) saturate(1.1);
    }

    /* Video Mirror Effect */
    .mirror {
      transform: scaleX(-1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--warm-white);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--brown-light);
      border-radius: 999px;
    }

    /* Camera Flash Overlay Animation */
    @keyframes flash-anim {
      0% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
      }
    }

    .flash-active {
      animation: flash-anim 0.4s ease-out forwards;
    }

    @media (max-width: 640px) {

      /* Make preview header inline at small screens */
      #preview-area {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .title-preview h2 {
        font-size: 14px;
        margin: 0;
        padding: 0;
      }

      #status-badge {
        font-size: 10px;
        padding: 4px 8px;
      }

      /* Shutter bar */
      #shutter-bar {
        gap: 6px;
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
      }

      /* Timer area */
      #shutter-bar label {
        font-size: 11px;
      }

      #shutter-bar select {
        width: 55px;
        padding: 4px 6px;
        font-size: 10px;
      }

      /* SINGLE button */
      #btn-take-single {
        padding: 1.5px 10px;
        min-width: 44px;
        flex-shrink: 0;
      }

      #countdown-num {
        font-size: 1rem;
      }

      #btn-take-single {
        font-size: 10px;
      }

      #btn-take-single i {
        font-size: 10px;
      }

      #btn-take-single span {
        display: none;
      }

      /* Keep shutter buttons on one line and slightly smaller icons */
      #shutter-btn {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: nowrap;
        margin-left: auto;
        flex: 0 0 auto;
        width: auto !important;
      }

      #shutter-btn>button {
        min-width: 0;
        white-space: nowrap;
      }

      #shutter-btn i {
        font-size: 14px;
      }
    }

    @media (max-width: 435px) {

      /* Force single-line shutter bar on very small screens and shrink icons */
      #shutter-bar {
        gap: 6px;
        padding-left: 6px;
        padding-right: 6px;
        justify-content: space-between;
      }

      #shutter-btn {
        gap: 6px;
        align-items: center;
        display: flex;
        flex-wrap: nowrap;
        margin-left: auto;
        flex: 0 0 auto;
        width: auto !important;
      }

      #shutter-btn>button,
      #shutter-btn button {
        padding: 6px 8px;
        font-size: 10px;
      }

      #shutter-btn i {
        font-size: 12px;
      }

      #timer-select {
        width: 30px;
        padding: 0px 5px;
        font-size: 10px;
      }

      /* Shrink the photostrip preview on very small screens */
      #photobooth-canvas {
        max-height: 480px !important;
      }

      #photobooth-preview-container {
        min-height: 260px !important;
      }
    }
  </style>
</head>

<body
  class="min-h-screen flex flex-col justify-between antialiased selection:bg-[var(--mauve-light)] selection:text-[var(--brown)]">

  <!-- Top Header -->
  <header
    class="border-b border-[var(--parchment)] bg-[var(--warm-white)]/90 backdrop-blur-md sticky top-0 z-40 flex justify-center items-center py-2 px-2">
    <a id="logo" href="x.com/731chapters"><img src="logo.png" alt="Logo" class="h-10 w-auto" /></a>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 gap-8 items-start">
    <section class="col-span-1 flex flex-col gap-5">
      <!-- Filter Selector Pills -->
      <div class="bg-[var(--warm-white)] p-3 border border-[var(--parchment)] shadow-sm">
        <p class="text-xs font-bold text-[var(--brown-mid)] uppercase tracking-wider mb-2 font-heading px-1">PHOTO
          FILTERS</p>
        <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
          <button onclick="setFilter('normal', 'Normal')"
            class="filter-btn active-filter px-3 py-1.5 rounded-[10px] text-xs font-semibold whitespace-nowrap bg-[var(--sage-bg)] text-[var(--brown)] border border-[var(--sage-light)] transition">
            Normal
          </button>
          <button onclick="setFilter('vintage', 'Vintage')"
            class="filter-btn px-3 py-1.5 rounded-[10px] text-xs font-semibold whitespace-nowrap bg-[var(--warm-white)] text-[var(--brown)] border border-[var(--parchment)] hover:bg-[var(--isabeline)] transition">
            Classic Vintage
          </button>
          <button onclick="setFilter('warm', 'Warm Soft')"
            class="filter-btn px-3 py-1.5 rounded-[10px] text-xs font-semibold whitespace-nowrap bg-[var(--warm-white)] text-[var(--brown)] border border-[var(--parchment)] hover:bg-[var(--isabeline)] transition">
            Warm Soft
          </button>
          <button onclick="setFilter('monochrome', 'Hitam Putih')"
            class="filter-btn px-3 py-1.5 rounded-[10px] text-xs font-semibold whitespace-nowrap bg-[var(--warm-white)] text-[var(--brown)] border border-[var(--parchment)] hover:bg-[var(--isabeline)] transition">
            Monochrome
          </button>
          <button onclick="setFilter('sage', 'Sage Olive')"
            class="filter-btn px-3 py-1.5 rounded-[10px] text-xs font-semibold whitespace-nowrap bg-[var(--warm-white)] text-[var(--brown)] border border-[var(--parchment)] hover:bg-[var(--isabeline)] transition">
            Sage Tone
          </button>
          <button onclick="setFilter('rosy', 'Rosy Pink')"
            class="filter-btn px-3 py-1.5 rounded-[10px] text-xs font-semibold whitespace-nowrap bg-[var(--warm-white)] text-[var(--brown)] border border-[var(--parchment)] hover:bg-[var(--isabeline)] transition">
            Rosy Mauve
          </button>
          <button onclick="setFilter('dramatic', 'Dramatic')"
            class="filter-btn px-3 py-1.5 rounded-[10px] text-xs font-semibold whitespace-nowrap bg-[var(--warm-white)] text-[var(--brown)] border border-[var(--parchment)] hover:bg-[var(--isabeline)] transition">
            Dramatic
          </button>
        </div>
      </div>
    </section>
    <!-- Photobooth preview and live slot result -->
    <section class="col-span-1 flex flex-col gap-5">
      <div class="bg-[var(--warm-white)] p-5 border border-[var(--parchment)] shadow-sm flex flex-col gap-4">
        <div id="preview-area" class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div class="title-preview">
            <h2 class="text-lg font-bold text-[var(--brown)] font-heading">RESULT PREVIEW</h2>
          </div>
          <div class="flex items-center gap-3">
            <span id="status-badge"
              class="px-2.5 py-1 bg-[var(--sage-bg)] text-[var(--sage)] text-xs font-semibold font-heading">
              0/4 PHOTOS
            </span>
          </div>
        </div>
        <!-- Action Shutter Bar -->
        <div id="shutter-bar" class="sticky top-[72px] z-30 flex flex-wrap items-center justify-between gap-3
                bg-[var(--warm-white)]/95 backdrop-blur-md py-3 px-1
                border-b border-[var(--parchment)]">
          <div class="flex items-center gap-3">
            <label class="text-xs font-semibold text-[var(--brown)] font-heading flex items-center gap-1.5">
              <i class="fa-solid fa-stopwatch text-[var(--mauve)]"></i>
              Timer:
            </label>
            <select id="timer-select"
              class="bg-[var(--mauve-bg)] border border-[var(--mauve-light)] rounded-[5px] text-[var(--text)] text-xs font-bold px-2.5 py-1.5 focus:outline-none font-heading">
              <option value="1">1 s</option>
              <option value="3">3 s</option>
              <option value="5">5 s</option>
            </select>
          </div>
          <div id="shutter-btn" class="flex items-center gap-2 w-full sm:w-auto">
            <button onclick="resetWholeBooth()" style="font-family: 'DM Sans', sans-serif;"
              class="px-3 py-1.5 text-xs font-medium rounded-[10px] bg-[var(--parchment)] text-[var(--brown)] hover:bg-[var(--mauve-light)] transition flex items-center gap-1.5">
              <i class="fa-solid fa-rotate-left"></i>
              <span class="hidden sm:inline">RETAKE</span>
            </button>
            <button id="btn-download" onclick="downloadResult()" disabled
              class="px-3 py-1.5 rounded-[10px] bg-[var(--mauve)] hover:bg-[var(--mauve-light)] disabled:opacity-40 disabled:cursor-not-allowed text-[var(--brown)] text-xs font-bold font-heading transition flex items-center gap-1.5">
              <i class="fa-solid fa-download"></i>
              <span class="hidden sm:inline">DOWNLOAD</span>
            </button>
            <button id="btn-take-single" onclick="captureSinglePhoto()"
              class="px-3 py-1.5 bg-[var(--mauve)] hover:bg-[var(--mauve-light)] text-[var(--brown)] rounded-[10px] font-bold text-sm transition shadow-sm flex items-center justify-center gap-1.5 font-heading"
              title="SINGLE PHOTO">
              <i class="fa-solid fa-camera text-base"></i>
              <span class="hidden sm:inline">CAPTURE</span>
            </button>
          </div>
        </div>
        <div id="photobooth-preview-container"
          class="relative mt-2 bg-[var(--sage-bg)] p-3 border border-[var(--parchment)] flex justify-center items-start min-h-[420px] overflow-auto">
          <canvas id="photobooth-canvas" class="w-full h-auto shadow-lg transition-all duration-300"
            style="max-height: 780px; display: block; width: auto; height: auto; background: #fff9f0; border: 3px solid rgba(122,92,72,0.25); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);"></canvas>
          <div id="countdown-overlay"
            class="hidden absolute inset-0 z-30 flex items-center justify-center bg-black/50 text-white">
            <span id="countdown-num"
              class="text-[2rem] font-bold tracking-[0.04em] px-8 py-6 bg-white/15 backdrop-blur-sm shadow-lg"></span>
          </div>
          <div id="flash-effect" class="hidden absolute inset-0 z-40 bg-white opacity-20"></div>
        </div>

        <div class="flex flex-col items-center sm:flex-row sm:items-center sm:justify-between gap-3">
          <div id="notif-download" class="notif-download">
            <p style="align-items: center; text-align: center;">Tap the DOWNLOAD button above to save the photobooth
              result, or right click / hold this preview as a backup option</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="footer">
    <div class="sec-rule-left"></div>
    <a href="https://x.com/731chapters"><i>731chapters</i></a></p>
    <div class="sec-rule"></div>
  </div>
  <div id="toast"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[var(--brown)] text-[var(--warm-white)] px-5 py-2.5 shadow-lg text-xs font-semibold font-heading opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2">
    <i class="fa-solid fa-circle-info text-[var(--mauve-light)]"></i>
    <span id="toast-msg">Notification</span>
  </div>

  <div id="webcam-elements"
    style="position:absolute; width:1px; height:1px; overflow:hidden; left:-9999px; top:-9999px;">
    <video id="webcam" autoplay playsinline muted style="width:1px; height:1px; opacity:0;"></video>
  </div>
  <div id="camera-fallback" class="hidden"></div>
  <canvas id="hidden-capture-canvas" class="hidden"></canvas>

  <script>
    const photos = [null, null, null, null];
    const photoImageCache = [null, null, null, null]; // cached decoded Image objects per slot, avoids re-decode races
    let activeSlotIndex = 0;
    let currentFilter = 'normal';
    let currentFacingMode = 'user';
    let isMirrored = true;
    let isSessionRunning = false;
    let audioEnabled = true;

    const video = document.getElementById('webcam');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownNum = document.getElementById('countdown-num');
    const flashEffect = document.getElementById('flash-effect');
    const mainCanvas = document.getElementById('photobooth-canvas');
    const hiddenCanvas = document.getElementById('hidden-capture-canvas');
    const activeFilterLabel = document.getElementById('active-filter-label');
    const slotIndicator = document.getElementById('slot-indicator');
    const statusBadge = document.getElementById('status-badge');
    const btnDownload = document.getElementById('btn-download');
    const cameraFallback = document.getElementById('camera-fallback');

    video.addEventListener('playing', startLivePreviewLoop);
    video.addEventListener('loadeddata', startLivePreviewLoop);

    const colorPalette = {
      'warm-white': '#FDFAF4',
      'parchment': '#e8d6ca',
      'isabeline': '#f2d8e2',
      'sage-bg': '#E8EBDC',
      'mauve-bg': '#FAEFF1',
      'brown': '#4A3728'
    };

    const templateFrameImage = new Image();
    let templateFrameLoaded = false;
    let isRenderingFinalCanvas = false;
    let renderFinalCanvasQueued = false;
    let previewRenderRequested = false;

    function requestPreviewRender() {
      if (previewRenderRequested) return;
      previewRenderRequested = true;
      requestAnimationFrame(async () => {
        previewRenderRequested = false;
        await renderFinalCanvas();
        if (video.readyState >= 2 && photos[activeSlotIndex] === null) {
          requestPreviewRender();
        }
      });
    }

    templateFrameImage.onload = () => {
      templateFrameLoaded = true;
      requestPreviewRender();
    };
    templateFrameImage.src = 'template-photoframe.png';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeepSound(frequency = 600, duration = 0.1) {
      if (!audioEnabled) return;
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.log('Audio play error:', e);
      }
    }

    function playShutterSound() {
      if (!audioEnabled) return;
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // Synthetic camera shutter sound using noise buffer + envelope
        const bufferSize = audioCtx.sampleRate * 0.15;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        filter.Q.setValueAtTime(3, audioCtx.currentTime);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        whiteNoise.start();
      } catch (e) {
        console.log('Shutter sound error:', e);
      }
    }

    let currentStream = null;

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: currentFacingMode,
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        cameraFallback.classList.add('hidden');
      } catch (err) {
        console.error('Camera access error:', err);
        cameraFallback.classList.remove('hidden');
        showToast("Can't Access the Camera");
      }
    }

    function switchCamera() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      isMirrored = (currentFacingMode === 'user');
      if (isMirrored) {
        video.classList.add('mirror');
      } else {
        video.classList.remove('mirror');
      }
      initCamera();
      showToast('Camera changed');
    }

    function toggleMirror() {
      isMirrored = !isMirrored;
      if (isMirrored) {
        video.classList.add('mirror');
        showToast('Mirror Mode');
      } else {
        video.classList.remove('mirror');
        showToast('Non-Mirror Mode');
      }
    }

    function setFilter(filterClass, name, btnEl) {
      currentFilter = filterClass;
      video.className = `w-full h-full object-cover filter-${filterClass} transition-all duration-300 ${isMirrored ? 'mirror' : ''}`;
      if (activeFilterLabel) {
        activeFilterLabel.innerText = `Filter: ${name}`;
      }

      // Update UI active buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active-filter', 'bg-[var(--sage-bg)]', 'border-[var(--sage-light)]');
        btn.classList.add('bg-[var(--warm-white)]', 'border-[var(--parchment)]');
      });

      const target = btnEl || (typeof event !== 'undefined' ? event.currentTarget : null);
      if (target) {
        target.classList.add('active-filter', 'bg-[var(--sage-bg)]', 'border-[var(--sage-light)]');
        target.classList.remove('bg-[var(--warm-white)]', 'border-[var(--parchment)]');
      }
    }
    async function captureSinglePhoto() {
      if (isSessionRunning) return;
      if (video.readyState < 2) {
        showToast('The Camera is not ready yet, wait a moment.');
        return;
      }

      isSessionRunning = true;
      disableActionButtons(true);

      const nextEmptySlot = photos.findIndex(p => p === null);
      let targetSlot = activeSlotIndex;

      if (targetSlot < 0 || targetSlot > 3 || photos[targetSlot] !== null) {
        targetSlot = nextEmptySlot;
      }
      if (targetSlot === -1) {
        targetSlot = activeSlotIndex;
      }

      activeSlotIndex = targetSlot;
      updateSlotIndicator();
      await renderFinalCanvas();

      const capturedSlot = activeSlotIndex;
      await runCountdown();
      captureCurrentSlot();

      isSessionRunning = false;
      disableActionButtons(false);
    }

    function updateSlotIndicator() {
      if (slotIndicator) {
        slotIndicator.innerText = `Foto ${activeSlotIndex + 1} dari 4`;
      }
      const previewContainer = document.getElementById('photobooth-preview-container');
      if (previewContainer) {
        previewContainer.scrollTop = 0;
      }
    }

    function runCountdown() {
      return new Promise((resolve) => {
        const timerSecs = parseInt(document.getElementById('timer-select').value) || 3;
        let count = timerSecs;

        countdownOverlay.classList.remove('hidden');
        countdownOverlay.style.pointerEvents = 'none';
        countdownNum.innerText = count;
        playBeepSound(500, 0.1);

        const interval = setInterval(() => {
          count--;
          if (count > 0) {
            countdownNum.innerText = count;
            playBeepSound(500, 0.1);
          } else {
            clearInterval(interval);
            countdownOverlay.classList.add('hidden');
            playBeepSound(900, 0.2); // final high beep
            resolve();
          }
        }, 1000);
      });
    }

    function captureCurrentSlot() {
      // Flash Animation
      flashEffect.classList.remove('flash-active');
      void flashEffect.offsetWidth; // trigger reflow
      flashEffect.classList.add('flash-active');
      playShutterSound();

      const vWidth = video.videoWidth || 1280;
      const vHeight = video.videoHeight || 960;

      hiddenCanvas.width = vWidth;
      hiddenCanvas.height = vHeight;
      const ctx = hiddenCanvas.getContext('2d');

      ctx.save();

      if (isMirrored) {
        ctx.translate(vWidth, 0);
        ctx.scale(-1, 1);
      }

      applyCssFilterToCanvasCtx(ctx, currentFilter);

      ctx.drawImage(video, 0, 0, vWidth, vHeight);
      ctx.restore();

      photos[activeSlotIndex] = hiddenCanvas.toDataURL('image/jpeg', 0.95);

      const nextEmptySlot = photos.findIndex(p => p === null);
      if (nextEmptySlot !== -1) {
        activeSlotIndex = nextEmptySlot;
      } else {
        activeSlotIndex = (activeSlotIndex + 1) % 4;
      }
      updateSlotIndicator();

      renderFinalCanvas();
      startLivePreviewLoop();
    }

    function startLivePreviewLoop() {
      if (video.readyState < 2 || photos[activeSlotIndex] !== null) {
        return;
      }
      requestPreviewRender();
    }

    function applyCssFilterToCanvasCtx(ctx, filterType) {
      switch (filterType) {
        case 'vintage':
          ctx.filter = 'sepia(0.35) contrast(1.1) brightness(0.95) saturate(1.2)';
          break;
        case 'warm':
          ctx.filter = 'sepia(0.2) saturate(1.35) hue-rotate(-10deg) brightness(1.05)';
          break;
        case 'monochrome':
          ctx.filter = 'grayscale(1) contrast(1.25) brightness(1.05)';
          break;
        case 'sage':
          ctx.filter = 'hue-rotate(40deg) saturate(0.85) contrast(1.1) brightness(0.98)';
          break;
        case 'rosy':
          ctx.filter = 'hue-rotate(-25deg) saturate(1.3) contrast(1.08) brightness(1.02)';
          break;
        case 'dramatic':
          ctx.filter = 'hue-rotate(-25deg) saturate(1.1) contrast(1.35) brightness(0.9)';
          break;
        default:
          ctx.filter = 'none';
      }
    }

    async function renderFinalCanvas() {
      if (isRenderingFinalCanvas) {
        renderFinalCanvasQueued = true;
        return;
      }
      isRenderingFinalCanvas = true;
      try {
        await renderFinalCanvasInternal();
      } finally {
        isRenderingFinalCanvas = false;
        if (renderFinalCanvasQueued) {
          renderFinalCanvasQueued = false;
          renderFinalCanvas();
        }
      }
    }

    async function renderFinalCanvasInternal() {
      const frameColorKey = 'warm-white';
      const frameBgColor = '#FDFAF4';
      const titleText = 'SNAP STUDIO';
      const dateText = new Date().toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).toUpperCase();

      const filledCount = photos.filter(p => p !== null).length;
      statusBadge.innerText = `${filledCount}/4 PHOTOS`;
      if (btnDownload) {
        btnDownload.disabled = filledCount === 0;
      }

      const ctx = mainCanvas.getContext('2d');

      mainCanvas.width = 600;
      mainCanvas.height = 1600;

      const outerPadding = 35;
      const gap = 20;
      const footerHeight = 180;
      const photoW = mainCanvas.width - (outerPadding * 2);
      const photoH = (mainCanvas.height - (outerPadding * 2) - (gap * 3) - footerHeight) / 4;

      ctx.fillStyle = frameBgColor;
      ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

      const drawPromises = [];
      for (let i = 0; i < 4; i++) {
        const posY = outerPadding + i * (photoH + gap);
        drawPromises.push(drawSlotImage(ctx, photos[i], outerPadding, posY, photoW, photoH, i + 1));
      }

      await Promise.all(drawPromises);

      const footerY = mainCanvas.height - footerHeight + 40;

      if (templateFrameLoaded) {
        ctx.drawImage(templateFrameImage, 0, 0, mainCanvas.width, mainCanvas.height);
      }
    }

    function drawSlotImage(ctx, dataUrl, x, y, w, h, slotNum) {
      ctx.save();

      ctx.fillStyle = 'rgba(176, 144, 128, 0.15)';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = 'rgba(74, 55, 40, 0.1)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      return new Promise((resolve) => {
        if (!dataUrl) {
          if (slotNum === activeSlotIndex + 1 && video.readyState >= 2) {
            ctx.save();
            if (isMirrored) {
              ctx.translate(x + w, y);
              ctx.scale(-1, 1);
            }
            applyCssFilterToCanvasCtx(ctx, currentFilter);
            const drawX = isMirrored ? 0 : x;
            const drawY = isMirrored ? 0 : y;

            // Cover-fit crop (same logic as drawImageIntoSlotBox) so the live
            // preview matches the aspect ratio the captured photo will have.
            const vw = video.videoWidth || w;
            const vh = video.videoHeight || h;
            const aspectVideo = vw / vh;
            const aspectBox = w / h;
            let sx, sy, sWidth, sHeight;
            if (aspectVideo > aspectBox) {
              sHeight = vh;
              sWidth = vh * aspectBox;
              sx = (vw - sWidth) / 2;
              sy = 0;
            } else {
              sWidth = vw;
              sHeight = vw / aspectBox;
              sx = 0;
              sy = (vh - sHeight) / 2;
            }
            ctx.drawImage(video, sx, sy, sWidth, sHeight, drawX, drawY, w, h);
            ctx.restore();
            ctx.save();
            ctx.strokeStyle = 'rgba(122,92,72,0.18)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '600 18px "DM Sans", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Live Preview', x + 14, y + 14);
            ctx.restore();
            ctx.restore();
            resolve();
            return;
          }

          ctx.fillStyle = '#7A5C48';
          ctx.font = '600 24px "DM Sans", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(`#${slotNum} PHOTO SLOT`, x + w / 2, y + h / 2 - 10);

          ctx.fillStyle = '#9A8070';
          ctx.font = '500 20px "EB Garamond", serif';
          ctx.fillText(`NOT SNAPPED YET`, x + w / 2, y + h / 2 + 20);
          ctx.restore();
          resolve();
          return;
        }

        const cacheIndex = slotNum - 1;
        const cachedImg = photoImageCache[cacheIndex];

        if (cachedImg && cachedImg.src === dataUrl && cachedImg.complete && cachedImg.naturalWidth > 0) {
          drawImageIntoSlotBox(ctx, cachedImg, x, y, w, h);
          ctx.restore();
          resolve();
          return;
        }

        const img = new Image();
        img.onload = () => {
          photoImageCache[cacheIndex] = img;
          drawImageIntoSlotBox(ctx, img, x, y, w, h);
          ctx.restore();
          resolve();
        };
        img.src = dataUrl;
      });
    }

    function drawImageIntoSlotBox(ctx, img, x, y, w, h) {
      const aspectImg = img.width / img.height;
      const aspectBox = w / h;

      let sx, sy, sWidth, sHeight;
      if (aspectImg > aspectBox) {
        sHeight = img.height;
        sWidth = img.height * aspectBox;
        sx = (img.width - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = img.width;
        sHeight = img.width / aspectBox;
        sx = 0;
        sy = (img.height - sHeight) / 2;
      }

      ctx.drawImage(img, sx, sy, sWidth, sHeight, x, y, w, h);
    }

    /* Download the final composed result (photos + template frame) */
    function downloadResult() {
      const filledCount = photos.filter(p => p !== null).length;
      if (filledCount === 0) {
        return;
      }

      mainCanvas.toBlob((blob) => {
        if (!blob) {
          showToast('Failed to prepare the download');
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        link.href = url;
        link.download = `musim-mekarnya-rasa-nidjaebooth.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 'image/png', 1);
    }

    function resetWholeBooth() {
      for (let i = 0; i < 4; i++) {
        photos[i] = null;
        photoImageCache[i] = null;
      }
      activeSlotIndex = 0;
      isSessionRunning = false;
      updateSlotIndicator();
      renderFinalCanvas();
      requestPreviewRender();
    }
    function disableActionButtons(disabled) {
      const autoBtn = document.getElementById('btn-take-auto');
      const singleBtn = document.getElementById('btn-take-single');

      if (autoBtn) {
        autoBtn.disabled = disabled;
      }
      if (singleBtn) {
        singleBtn.disabled = disabled;
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.innerText = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    window.addEventListener('load', () => {
      initCamera();
      renderFinalCanvas();
      startLivePreviewLoop();
    });
  </script>
